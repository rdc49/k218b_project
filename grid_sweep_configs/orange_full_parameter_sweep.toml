# Config file for the 'orange' parameter sweep of the K218b project.
#
# Full factorial grid: 4 (H_budget) x 4 (C_budget) x 4 (N_budget) x
# 4 (S_budget) x 4 (fO2_shift_IW) = 1024 points. This is NOT meant to
# be submitted as a single `proteus grid` run across the whole cluster at
# once. It is split into 16 batches of 64 points each in orange_batch_configs/
# (batch_orange01.toml .. batch_orange16.toml), split by fO2_shift_IW
# (4 values) x H_budget low/high half (2 groups) x C_budget low/high half
# (2 groups), each batch keeping the full N/S axes -- generated by
# scripts/generate_grid_configs.py. See CLAUDE.md and
# grid_sweep_cluster_howto.md for the batch-sizing rationale (unchanged from
# the original sweep) and the war-plan-orange skill for why this sweep's
# parameter ranges were narrowed relative to the original. This file is kept
# as the reference definition of the full sweep; submit the batch files
# instead.

output = "k218b_project_orange_sweep/"
symlink = ""

ref_config = "input/nogit_k218b_project/k218b_fiducial.toml"

use_slurm = false
max_jobs = 500
max_days = 1
max_mem  = 3

["planet.elements.H_budget"]
    method = "direct"
    values = [30000.0,40000.0,50000.0,60000.0]

["planet.elements.C_budget"]
    method = "direct"
    values = [0.0005,0.005,0.05,0.5]

["planet.elements.N_budget"]
    method = "direct"
    values = [0.0005,0.005,0.05,0.5]

["planet.elements.S_budget"]
    method = "direct"
    values = [0.0005,0.005,0.05,0.5]

["outgas.fO2_shift_IW"]
    method = "direct"
    values = [-4.0,-3.0,-2.0,-1.0]
